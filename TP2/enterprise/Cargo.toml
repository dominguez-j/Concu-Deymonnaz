[package]
name = "enterprise"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-rt = "2.11.0"
actix_async_handler = "0.1.0"
config = "0.15.19"
futures = "0.3.31"
lib = { path = "../lib" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-std"] }
tokio-stream = { version = "0.1.17", features = ["io-util"] }
tokio-util = "0.7.17"
dotenvy = "0.15"